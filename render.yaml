# Render Blueprint: New → Blueprint → pick this repo.
#
# ONE free web service runs everything: the Express API also serves the built Angular PWA.
# - Free web services share 750 instance-hours per workspace per month; one service running
#   24/7 needs at most 744, so keep this the only free web service in the workspace.
# - The app pings itself every 10 minutes (RENDER_EXTERNAL_URL/api/health) so it never reaches
#   the 15-minute idle sleep. Optional backup: an UptimeRobot monitor on /api/health.
# - Same origin for app and API, so the auth cookie is first-party (works in Safari).
services:
  - type: web
    name: nik-secret-santa # → https://nik-secret-santa.onrender.com (URL is fixed when the service is created)
    runtime: node
    plan: free
    # devDependencies (TypeScript, Angular CLI) are needed to build, even with NODE_ENV=production.
    buildCommand: >-
      npm ci --prefix server --include=dev &&
      npm ci --prefix client --include=dev &&
      npm run build --prefix server &&
      npm run build --prefix client
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '24'
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://nik-secret-santa.onrender.com # must match the service URL exactly
      - key: COOKIE_SAMESITE
        value: lax
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: secret-santa
      # Email: Render free instances block outbound SMTP ports, so use an HTTPS API key
      # (Brevo or Resend). Leave the SMTP_* values empty on Render.
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_SECURE
        value: 'false'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false # e.g. "Secret Santa <santa@yourdomain.com>"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false # e.g. mailto:you@example.com
      - key: DATA_RETENTION_DAYS
        value: '60'
      - key: DAILY_JOB_CRON
        value: '0 8 * * *'
